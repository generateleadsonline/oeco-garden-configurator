[build]
  command = "sh build.sh"
  publish = "public"

# public/ is generated from src/ by tools/build.py and committed, so Netlify only checks it.
# Headers (noindex, CSP with hashes, caching) live in public/_headers, written by the build.

[[redirects]]
  from = "/"
  to = "/configurator/"
  status = 302

[[redirects]]
  from = "/configurator"
  to = "/configurator/"
  status = 301
